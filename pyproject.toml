[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-engine"
version = "0.2.0"
description = "A falsifiable, lazily differentiated cognitive organ harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
morph = "morph_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["morph_engine*"]

[tool.setuptools.package-data]
"morph_engine.genome" = ["*.json"]
